<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2127;
    --panel-edge: #2b2f38;
    --card: #262a33;
    --card-edge: #343945;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4e96e6;
    --rest: #57b98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 9px;
    padding: 12px 14px;
  }
  input {
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 9px;
    font: inherit;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: default; opacity: .5; }

  #watch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #label { flex: 1; min-width: 140px; }
  #elapsed {
    font-size: 24px;
    font-variant-numeric: tabular-nums;
    min-width: 104px;
    text-align: right;
  }
  body.running #elapsed { color: var(--accent); }
  #toggle { min-width: 78px; }
  #manual { display: flex; align-items: center; gap: 6px; }
  #add-label { width: 130px; }
  #add-minutes { width: 62px; text-align: right; }

  #totals { color: var(--muted); font-size: 12px; display: flex; gap: 14px; }
  #totals b { color: var(--text); font-weight: 600; }

  #ranges { display: flex; gap: 6px; }
  #ranges button.on { border-color: var(--accent); color: var(--accent); }

  #chart { display: flex; align-items: flex-end; gap: 4px; height: 92px; margin-top: 10px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .bar i {
    display: block;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    opacity: .85;
  }
  .bar span {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    padding-top: 4px;
    white-space: nowrap;
    overflow: hidden;
  }
  .bar.today i { background: var(--rest); }

  #middle { display: flex; gap: 12px; min-height: 0; }
  #middle > div { flex: 1; min-width: 0; overflow: auto; }
  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 0;
    border-bottom: 1px solid var(--panel-edge);
  }
  .row:last-child { border-bottom: none; }
  .row em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 12px; }

  #log { flex: 1; min-height: 120px; overflow: auto; }
  #log .row { align-items: center; }
  #log .when { color: var(--muted); font-variant-numeric: tabular-nums; width: 96px; flex: none; }
  #log .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log .kind {
    color: var(--muted);
    font-size: 11px;
    border: 1px solid var(--card-edge);
    border-radius: 5px;
    padding: 1px 6px;
    flex: none;
  }
  #log .took { font-variant-numeric: tabular-nums; width: 74px; text-align: right; flex: none; }
  #log button {
    padding: 1px 7px;
    color: var(--muted);
    border-color: transparent;
    background: none;
    flex: none;
  }
  #log button:hover { color: #e2686d; border-color: #e2686d; }
</style>
</head>
<body>
  <div class="panel">
    <div id="watch">
      <input id="label" type="text" maxlength="80" placeholder="what are you working on">
      <button id="toggle">Start</button>
      <div id="elapsed">00:00:00</div>
      <div id="manual">
        <input id="add-label" type="text" maxlength="80" placeholder="add by hand">
        <input id="add-minutes" type="number" min="1" max="1440" placeholder="min">
        <button id="add">Add</button>
      </div>
    </div>
    <div id="totals" style="margin-top:10px">
      <span>today <b id="today">0m</b></span>
      <span>range <b id="total">0m</b></span>
      <span>created <b id="created">0</b></span>
      <span>done <b id="done">0</b></span>
      <span>rate <b id="rate">0%</b></span>
      <span id="split"></span>
    </div>
  </div>

  <div class="panel">
    <div id="ranges">
      <button data-days="1">Today</button>
      <button data-days="7">7 days</button>
      <button data-days="30">30 days</button>
    </div>
    <div id="chart"></div>
  </div>

  <div id="middle" class="panel">
    <div><h2>By task</h2><div id="by-label"></div></div>
    <div><h2>By plugin</h2><div id="by-type"></div></div>
    <div><h2>By tag</h2><div id="by-tag"></div></div>
  </div>

  <div class="panel" id="log-panel" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let bridge = null;
let days = 7;

function pad(value) {
  return String(value).padStart(2, "0");
}

function clock(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return `${pad(h)}:${pad(m)}:${pad(seconds % 60)}`;
}

function span(seconds) {
  if (!seconds) return "0m";
  const h = Math.floor(seconds / 3600);
  const m = Math.round((seconds % 3600) / 60);
  if (h && m) return `${h}h ${pad(m)}m`;
  if (h) return `${h}h`;
  if (m) return `${m}m`;
  return `${seconds}s`;
}

function label(day) {
  const parsed = new Date(`${day}T00:00:00`);
  return parsed.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2);
}

function renderList(node, items) {
  node.textContent = "";
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "nothing yet";
    node.appendChild(empty);
    return;
  }
  items.forEach((item) => {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("b");
    name.textContent = item.name;
    name.title = item.name;
    const value = document.createElement("em");
    value.textContent = span(item.seconds);
    row.append(name, value);
    node.appendChild(row);
  });
}

function renderChart(series) {
  const chart = document.getElementById("chart");
  const today = new Date().toISOString().slice(0, 10);
  const peak = Math.max(1, ...series.map((point) => point.seconds));
  chart.textContent = "";
  series.forEach((point) => {
    const bar = document.createElement("div");
    bar.className = point.day === today ? "bar today" : "bar";
    bar.title = `${point.day} — ${span(point.seconds)}`;
    const fill = document.createElement("i");
    fill.style.height = `${Math.round((point.seconds / peak) * 100)}%`;
    const name = document.createElement("span");
    name.textContent = series.length > 14 ? point.day.slice(8) : label(point.day);
    bar.append(fill, name);
    chart.appendChild(bar);
  });
}

function renderLog(entries) {
  const log = document.getElementById("log");
  log.textContent = "";
  if (!entries.length) {
    log.innerHTML = '<div class="empty">nothing logged in this range</div>';
    return;
  }
  entries.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "row";

    const when = document.createElement("div");
    when.className = "when";
    when.textContent = `${entry.day.slice(5)} ${entry.time}`;

    const what = document.createElement("div");
    what.className = "what";
    what.textContent = entry.label || "—";
    what.title = entry.tags.length ? entry.tags.join(", ") : "";

    const kind = document.createElement("div");
    kind.className = "kind";
    kind.textContent = entry.source && entry.source !== entry.type
      ? `${entry.type} · ${entry.source}` : entry.type;

    const took = document.createElement("div");
    took.className = "took";
    took.textContent = span(entry.seconds);

    const drop = document.createElement("button");
    drop.textContent = "×";
    drop.title = "forget this entry";
    drop.addEventListener("click", () => bridge.forget(entry.id));

    row.append(when, what, kind, took, drop);
    log.appendChild(row);
  });
}

function render(data) {
  document.body.classList.toggle("running", data.running);
  document.getElementById("elapsed").textContent = clock(data.elapsed);
  document.getElementById("toggle").textContent = data.running ? "Stop" : "Start";
  const input = document.getElementById("label");
  if (document.activeElement !== input) input.value = data.running ? data.label : input.value;
  input.disabled = data.running;

  document.getElementById("today").textContent = span(data.today);
  document.getElementById("total").textContent = span(data.total);
  document.getElementById("created").textContent = data.created;
  document.getElementById("done").textContent = data.done + (data.undone ? ` (−${data.undone})` : "");
  document.getElementById("rate").textContent = `${data.rate}%`;
  document.getElementById("split").textContent = data.by_source
    .map((item) => `${item.name} ${span(item.seconds)}`).join(" · ");

  document.querySelectorAll("#ranges button").forEach((button) => {
    button.classList.toggle("on", Number(button.dataset.days) === data.days);
  });

  renderChart(data.series);
  renderList(document.getElementById("by-label"), data.by_label);
  renderList(document.getElementById("by-type"), data.by_type);
  renderList(document.getElementById("by-tag"), data.by_tag);
  renderLog(data.entries);
}

function refresh() {
  bridge.snapshot(days, (payload) => render(JSON.parse(payload)));
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  bridge = channel.objects.stats;
  bridge.changed.connect(refresh);

  document.getElementById("toggle").addEventListener("click", () => {
    if (document.body.classList.contains("running")) {
      bridge.stop();
      return;
    }
    bridge.start(document.getElementById("label").value);
  });

  document.getElementById("label").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !document.body.classList.contains("running"))
      bridge.start(event.target.value);
  });

  document.getElementById("add").addEventListener("click", () => {
    const minutes = parseInt(document.getElementById("add-minutes").value, 10) || 0;
    if (!minutes) return;
    bridge.add(document.getElementById("add-label").value, minutes);
    document.getElementById("add-minutes").value = "";
  });

  document.querySelectorAll("#ranges button").forEach((button) => {
    button.addEventListener("click", () => {
      days = Number(button.dataset.days);
      refresh();
    });
  });

  refresh();
});
</script>
</body>
</html>
