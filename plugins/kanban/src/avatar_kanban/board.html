<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2127;
    --panel-edge: #2b2f38;
    --card: #262a33;
    --card-edge: #343945;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4e96e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-edge);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header button {
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }
  #reset { margin-left: auto; }
  #clear:hover { color: #e2686d; border-color: #e2686d; }
  #board {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 16px 18px;
    overflow-x: auto;
    align-items: flex-start;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    width: 280px;
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }
  .column.drop { border-color: var(--accent); }
  .column.moving { opacity: .45; }
  .column.progress h2 { color: var(--accent); }
  .column.progress h2 .mark { padding-right: 6px; }
  .column h2 {
    cursor: grab;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 8px;
    display: flex;
    justify-content: space-between;
  }
  .column h2 input {
    flex: 1;
    min-width: 0;
    margin-right: 8px;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 5px;
    color: var(--text);
    padding: 1px 5px;
    font: inherit;
    text-transform: none;
    letter-spacing: normal;
    outline: none;
  }
  .cards {
    list-style: none;
    margin: 0;
    padding: 0 10px 6px;
    overflow-y: auto;
    flex: 1;
    min-height: 40px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: grab;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .card.dragging { opacity: .4; }
  .card .title { flex: 1; line-height: 1.35; }
  .card .created { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .card .due {
    margin-top: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    border-radius: 5px;
    padding: 2px 4px;
    font: inherit;
    font-size: 11px;
    color-scheme: dark;
  }
  .card .due:hover, .card .due:focus { border-color: var(--card-edge); outline: none; }
  .card .due.set { color: #e0a458; }
  .tagstrip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag {
    border: 1px solid var(--card-edge);
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
  }
  .card .kill {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .card .kill:hover { color: #e2686d; }
  .card .note {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .add { display: flex; padding: 0 10px 10px; }
  .add input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font: inherit;
    outline: none;
  }
  .add input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Kanban</h1>
  <button id="reset" title="move everything that is not done back to the backlog">Reset</button>
  <button id="clear" title="delete every card">Full reset</button>
</header>
<div id="board"></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let board = null;
let dragged = null;
let draggedColumn = null;
let latest = {columns: [], tags: []};

function openEditor(card) {
  avatarEditor.open({
    title: card.title,
    text: card.text,
    stamp: card.created ? "created " + card.created : "",
    tags: {selected: (card.tags || []).map((tag) => tag.name), all: latest.tags},
    onSave: (result) => board.edit_card(
      card.id, result.title, result.text, JSON.stringify(result.tags)),
  });
}

function tagStrip(tags) {
  const strip = document.createElement("div");
  strip.className = "tagstrip";
  tags.forEach((tag) => {
    const chip = document.createElement("span");
    chip.className = "tag";
    chip.textContent = tag.name;
    if (tag.color) {
      chip.style.borderColor = tag.color;
      chip.style.color = tag.color;
    }
    strip.appendChild(chip);
  });
  return strip;
}

function cardNode(card) {
  const li = document.createElement("li");
  li.className = "card";
  li.draggable = true;
  li.dataset.id = card.id;

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = card.title;
  if (card.text) {
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = card.text;
    title.appendChild(note);
  }
  if (card.tags && card.tags.length) title.appendChild(tagStrip(card.tags));
  if (card.created) {
    const stamp = document.createElement("span");
    stamp.className = "created";
    stamp.textContent = card.created;
    title.appendChild(stamp);
  }

  const kill = document.createElement("button");
  kill.className = "kill";
  kill.textContent = "×";
  kill.addEventListener("click", (event) => {
    event.stopPropagation();
    board.delete_card(card.id);
  });

  const due = document.createElement("input");
  due.type = "date";
  due.className = card.deadline ? "due set" : "due";
  due.value = card.deadline || "";
  due.title = "deadline";
  due.addEventListener("change", () => board.set_deadline(card.id, due.value));
  due.addEventListener("mousedown", (event) => event.stopPropagation());
  due.addEventListener("click", (event) => event.stopPropagation());
  title.appendChild(due);

  li.addEventListener("click", () => openEditor(card));
  li.append(title, kill);
  li.addEventListener("dragstart", () => {
    dragged = card.id;
    li.classList.add("dragging");
  });
  li.addEventListener("dragend", () => {
    dragged = null;
    li.classList.remove("dragging");
  });
  return li;
}

function columnDropIndex(root, x) {
  const columns = [...root.querySelectorAll(".column:not(.moving)")];
  for (let i = 0; i < columns.length; i++) {
    const box = columns[i].getBoundingClientRect();
    if (x < box.left + box.width / 2) return i;
  }
  return columns.length;
}

function dropIndex(list, y) {
  const rows = [...list.querySelectorAll(".card:not(.dragging)")];
  for (let i = 0; i < rows.length; i++) {
    const box = rows[i].getBoundingClientRect();
    if (y < box.top + box.height / 2) return i;
  }
  return rows.length;
}

function renameColumn(head, label, column) {
  const input = document.createElement("input");
  input.value = column.name;
  head.draggable = false;
  label.replaceWith(input);
  input.focus();
  input.select();

  let closed = false;
  const finish = (commit) => {
    if (closed) return;
    closed = true;
    const name = input.value.trim();
    head.draggable = true;
    input.replaceWith(label);
    if (commit && name && name !== column.name) board.rename_column(column.id, name);
  };

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") finish(true);
    else if (event.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

function columnNode(column) {
  const working = column.role === "in_progress";
  const section = document.createElement("section");
  section.className = working ? "column progress" : "column";

  const head = document.createElement("h2");
  const label = document.createElement("span");
  label.textContent = column.name;
  const count = document.createElement("span");
  count.textContent = column.cards.length;

  if (working) {
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "◉";
    label.prepend(mark);
  }

  head.append(label, count);
  head.draggable = true;
  head.title = working
    ? "time is logged against every card here — drag to reorder, double click to rename"
    : "drag to reorder, double click to rename";
  label.addEventListener("dblclick", () => renameColumn(head, label, column));
  head.addEventListener("dragstart", (event) => {
    draggedColumn = column.id;
    section.classList.add("moving");
    event.stopPropagation();
  });
  head.addEventListener("dragend", () => {
    draggedColumn = null;
    section.classList.remove("moving");
  });

  const list = document.createElement("ul");
  list.className = "cards";
  column.cards.forEach((card) => list.appendChild(cardNode(card)));

  const adder = document.createElement("div");
  adder.className = "add";
  const input = document.createElement("input");
  input.placeholder = "Add a card…";
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && input.value.trim()) {
      board.add_card(column.id, input.value);
      input.value = "";
    }
  });
  adder.appendChild(input);

  section.addEventListener("dragover", (event) => {
    event.preventDefault();
    if (!draggedColumn) section.classList.add("drop");
  });
  section.addEventListener("dragleave", () => section.classList.remove("drop"));
  section.addEventListener("drop", (event) => {
    event.preventDefault();
    section.classList.remove("drop");
    if (draggedColumn) return;
    if (dragged) board.move_card(dragged, column.id, dropIndex(list, event.clientY));
  });

  section.append(head, list, adder);
  return section;
}

function render(data) {
  latest = data;
  const root = document.getElementById("board");
  root.textContent = "";
  data.columns.forEach((column) => root.appendChild(columnNode(column)));
}

function wireBoard() {
  const root = document.getElementById("board");
  root.addEventListener("dragover", (event) => {
    if (draggedColumn) event.preventDefault();
  });
  root.addEventListener("drop", (event) => {
    if (!draggedColumn) return;
    event.preventDefault();
    board.move_column(draggedColumn, columnDropIndex(root, event.clientX));
    draggedColumn = null;
  });
}

function refresh() {
  board.snapshot((payload) => render(JSON.parse(payload)));
}

function wireHeader() {
  document.getElementById("reset").addEventListener("click", () => board.reset());
  document.getElementById("clear").addEventListener("click", () => {
    if (confirm("Delete every card and start over?")) board.clear();
  });
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  board = channel.objects.board;
  board.changed.connect(refresh);
  wireHeader();
  wireBoard();
  refresh();
});
</script>
</body>
</html>
