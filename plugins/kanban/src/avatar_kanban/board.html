<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2127;
    --panel-edge: #2b2f38;
    --card: #262a33;
    --card-edge: #343945;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4e96e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-edge);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  header button {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }
  #board {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 16px 18px;
    overflow-x: auto;
    align-items: flex-start;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    width: 280px;
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }
  .column.drop { border-color: var(--accent); }
  .column h2 {
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 8px;
    display: flex;
    justify-content: space-between;
  }
  .cards {
    list-style: none;
    margin: 0;
    padding: 0 10px 6px;
    overflow-y: auto;
    flex: 1;
    min-height: 40px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: grab;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .card.dragging { opacity: .4; }
  .card .title { flex: 1; line-height: 1.35; }
  .card .created { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .card .kill {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  .card .kill:hover { color: #e2686d; }
  .add { display: flex; padding: 0 10px 10px; }
  .add input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font: inherit;
    outline: none;
  }
  .add input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Kanban</h1>
  <span id="status">state owned by core</span>
  <button id="reset">Reset</button>
</header>
<div id="board"></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let board = null;
let dragged = null;

window.setStatus = (text) => {
  document.getElementById("status").textContent = text;
};

function cardNode(card) {
  const li = document.createElement("li");
  li.className = "card";
  li.draggable = true;
  li.dataset.id = card.id;

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = card.title;
  if (card.created) {
    const stamp = document.createElement("span");
    stamp.className = "created";
    stamp.textContent = card.created;
    title.appendChild(stamp);
  }

  const kill = document.createElement("button");
  kill.className = "kill";
  kill.textContent = "×";
  kill.addEventListener("click", () => board.delete_card(card.id));

  li.append(title, kill);
  li.addEventListener("dragstart", () => {
    dragged = card.id;
    li.classList.add("dragging");
  });
  li.addEventListener("dragend", () => {
    dragged = null;
    li.classList.remove("dragging");
  });
  return li;
}

function dropIndex(list, y) {
  const rows = [...list.querySelectorAll(".card:not(.dragging)")];
  for (let i = 0; i < rows.length; i++) {
    const box = rows[i].getBoundingClientRect();
    if (y < box.top + box.height / 2) return i;
  }
  return rows.length;
}

function columnNode(column) {
  const section = document.createElement("section");
  section.className = "column";

  const head = document.createElement("h2");
  head.innerHTML = `<span>${column.name}</span><span>${column.cards.length}</span>`;

  const list = document.createElement("ul");
  list.className = "cards";
  column.cards.forEach((card) => list.appendChild(cardNode(card)));

  const adder = document.createElement("div");
  adder.className = "add";
  const input = document.createElement("input");
  input.placeholder = "Add a card…";
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && input.value.trim()) {
      board.add_card(column.id, input.value);
      input.value = "";
    }
  });
  adder.appendChild(input);

  section.addEventListener("dragover", (event) => {
    event.preventDefault();
    section.classList.add("drop");
  });
  section.addEventListener("dragleave", () => section.classList.remove("drop"));
  section.addEventListener("drop", (event) => {
    event.preventDefault();
    section.classList.remove("drop");
    if (dragged) board.move_card(dragged, column.id, dropIndex(list, event.clientY));
  });

  section.append(head, list, adder);
  return section;
}

function render(data) {
  const root = document.getElementById("board");
  root.textContent = "";
  data.columns.forEach((column) => root.appendChild(columnNode(column)));
}

function refresh() {
  board.snapshot((payload) => render(JSON.parse(payload)));
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  board = channel.objects.board;
  board.changed.connect(refresh);
  document.getElementById("reset").addEventListener("click", () => board.reset());
  refresh();
});
</script>
</body>
</html>
