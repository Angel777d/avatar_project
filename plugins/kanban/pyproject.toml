[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar_kanban"
version = "0.4.1"
description = "Kanban board plugin for the avatar project"

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]

requires-python = ">=3.13"
dependencies = [
    "avatar.api >= 0.1.0",
    "avatar.ui >= 0.1.0",
]

license = "MIT"

[project.entry-points.'avatar.plugins']
avatar_kanban = 'avatar_kanban'

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avatar_kanban = ["*.html"]
