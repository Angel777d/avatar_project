<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pomodoro</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2127;
    --panel-edge: #2b2f38;
    --card: #262a33;
    --card-edge: #343945;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4e96e6;
    --rest: #57b98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
  }
  #phase {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  body.work #phase { color: var(--accent); }
  body.break #phase { color: var(--rest); }

  #dial { position: relative; width: 190px; height: 190px; }
  #dial svg { transform: rotate(-90deg); }
  #track { stroke: var(--panel-edge); }
  #sweep { stroke: var(--muted); transition: stroke-dashoffset .3s linear; }
  body.work #sweep { stroke: var(--accent); }
  body.break #sweep { stroke: var(--rest); }
  #clock {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-variant-numeric: tabular-nums;
  }

  #controls { display: flex; gap: 8px; }
  button {
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 16px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: default; opacity: .5; }
  #done { color: var(--muted); font-size: 12px; }
  #cog {
    position: absolute;
    top: 12px;
    right: 14px;
    padding: 4px 9px;
    color: var(--muted);
  }
  #settings {
    display: none;
    width: 100%;
    max-width: 300px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 9px;
    padding: 12px 14px;
  }
  body.settings-open #settings { display: block; }
  #settings label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  #settings input {
    width: 74px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font: inherit;
    text-align: right;
    outline: none;
  }
  #settings input:focus { border-color: var(--accent); }
  #settings select {
    width: 96px;
    background: var(--bg);
    border: 1px solid var(--panel-edge);
    color: var(--text);
    border-radius: 5px;
    padding: 3px 4px;
    font: inherit;
    outline: none;
  }
  #settings select:focus { border-color: var(--accent); }
  #preset-row { display: flex; gap: 6px; margin-top: 6px; }
  #preset-row button { flex: 1; }
  #p-del:hover:not(:disabled) { border-color: #e2686d; color: #e2686d; }
  #save { width: 100%; margin-top: 4px; }
</style>
</head>
<body>
  <button id="cog" title="Settings">settings</button>
  <div id="phase">Ready</div>
  <div id="dial">
    <svg width="190" height="190">
      <circle id="track" cx="95" cy="95" r="84" fill="none" stroke-width="10"></circle>
      <circle id="sweep" cx="95" cy="95" r="84" fill="none" stroke-width="10" stroke-linecap="round"></circle>
    </svg>
    <div id="clock">25:00</div>
  </div>
  <div id="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="skip">Skip</button>
    <button id="reset">Reset</button>
  </div>
  <div id="done">0 done today</div>
  <div id="settings">
    <label>Preset <select id="s-preset"></select></label>
    <label>Name <input id="s-name" type="text" maxlength="40"></label>
    <label>Focus, minutes <input id="s-work" type="number" min="1" max="180"></label>
    <label>Short break <input id="s-short" type="number" min="1" max="180"></label>
    <label>Long break <input id="s-long" type="number" min="1" max="180"></label>
    <label>Long break every <input id="s-every" type="number" min="1" max="12"></label>
    <label>Sequences in a row <input id="s-seq" type="number" min="1" max="24"></label>
    <div id="preset-row">
      <button id="p-new">New</button>
      <button id="p-del">Delete</button>
    </div>
    <button id="save">Save</button>
  </div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let bridge = null;
const CIRCUMFERENCE = 2 * Math.PI * 84;

function clock(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function minutes(seconds) {
  return Math.max(1, Math.round(seconds / 60));
}

function renderPresets(data) {
  const list = document.getElementById("s-preset");
  if (document.activeElement === list) return;
  list.textContent = "";
  data.presets.forEach((preset) => {
    const option = document.createElement("option");
    option.value = preset.id;
    option.textContent = preset.name;
    if (preset.id === data.selected) option.selected = true;
    list.appendChild(option);
  });
  document.getElementById("p-del").disabled = data.presets.length < 2;
}

function renderSettings(settings) {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  document.getElementById("s-name").value = settings.name;
  document.getElementById("s-work").value = minutes(settings.work);
  document.getElementById("s-short").value = minutes(settings.short_break);
  document.getElementById("s-long").value = minutes(settings.long_break);
  document.getElementById("s-every").value = settings.long_break_every;
  document.getElementById("s-seq").value = settings.sequences;
}

function render(data) {
  const open = document.body.classList.contains("settings-open");
  document.body.className = open ? `${data.phase} settings-open` : data.phase;
  document.getElementById("phase").textContent = data.label;
  document.getElementById("clock").textContent = clock(data.remaining);

  const left = data.total ? data.remaining / data.total : 0;
  const sweep = document.getElementById("sweep");
  sweep.style.strokeDasharray = CIRCUMFERENCE;
  sweep.style.strokeDashoffset = CIRCUMFERENCE * (1 - left);

  document.getElementById("start").disabled = data.running;
  document.getElementById("pause").disabled = !data.running;
  document.getElementById("skip").disabled = data.phase === "idle";
  const parts = [data.preset, `${data.done_today} done today`];
  if (data.streak) parts.push(`${data.streak} in a row`);
  if (data.sequences > 1 && data.phase !== "idle")
    parts.push(`set ${data.sequence + 1} of ${data.sequences}`);
  if (data.next && data.next !== data.preset) parts.push(`next: ${data.next}`);
  document.getElementById("done").textContent = parts.join(" · ");
  renderPresets(data);
  renderSettings(data.settings);
}

function refresh() {
  bridge.snapshot((payload) => render(JSON.parse(payload)));
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  bridge = channel.objects.pomodoro;
  bridge.changed.connect(refresh);
  document.getElementById("start").addEventListener("click", () => bridge.start());
  document.getElementById("pause").addEventListener("click", () => bridge.pause());
  document.getElementById("skip").addEventListener("click", () => bridge.skip());
  document.getElementById("reset").addEventListener("click", () => bridge.reset());
  document.getElementById("cog").addEventListener("click", () =>
    document.body.classList.toggle("settings-open"));
  document.getElementById("s-preset").addEventListener("change", (event) =>
    bridge.select_preset(event.target.value));
  document.getElementById("p-new").addEventListener("click", () =>
    bridge.save_preset("", "New preset", 0, 0, 0, 0, 0));
  document.getElementById("p-del").addEventListener("click", () =>
    bridge.delete_preset(document.getElementById("s-preset").value));
  document.getElementById("save").addEventListener("click", () => {
    const read = (id) => parseInt(document.getElementById(id).value, 10) || 0;
    bridge.save_preset(document.getElementById("s-preset").value,
                       document.getElementById("s-name").value,
                       read("s-work") * 60, read("s-short") * 60,
                       read("s-long") * 60, read("s-every"), read("s-seq"));
    document.body.classList.remove("settings-open");
  });
  refresh();
});
</script>
</body>
</html>
