[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar_shell"
version = "0.1.0"
description = "Tabbed window host for avatar project plugin pages"

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]

requires-python = ">=3.13"
dependencies = [
    "avatar.api >= 0.1.0",
    "avatar.ui >= 0.1.0",
    "PySide6 >= 6.9",
]

license = "MIT"

[project.entry-points.'avatar.plugins']
avatar_shell = 'avatar_shell'

[tool.setuptools.packages.find]
where = ["src"]
