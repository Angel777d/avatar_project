[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar_default"
version = "0.1.1"
description = "Default avatar plugin: the on-screen character and its speech pipeline"

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]

requires-python = ">=3.13"
dependencies = [
    "avatar.api >= 0.1.0",
    "avatar.ui >= 0.1.0",
]

license = "MIT"

[project.entry-points.'avatar.plugins']
avatar_default = 'avatar_default'

[tool.setuptools.packages.find]
where = ["src"]
