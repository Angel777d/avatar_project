<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<style>
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-edge);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; min-width: 150px; }
  header .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .nav { display: flex; gap: 6px; }
  header button {
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 11px;
    font: inherit;
    line-height: 1.5;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }
  header button[hidden] { display: none; }
  main { flex: 1; display: flex; gap: 16px; padding: 16px 18px; min-height: 0; }

  #month { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .weekdays, .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding-bottom: 6px;
  }
  .weekdays span { text-align: center; }
  .week { margin-bottom: 6px; flex: 1; }
  .day {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 54px;
  }
  .day:hover { border-color: var(--accent); }
  .day.blank { background: transparent; border-color: transparent; cursor: default; }
  .day.today .num { color: var(--accent); font-weight: 600; }
  .day.selected { border-color: var(--accent); background: #232833; }
  .num { font-size: 13px; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .dot.deadline { background: var(--warn); }

  #panel {
    width: 300px;
    flex: 0 0 300px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #panel h2 {
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 8px;
  }
  #notes { list-style: none; margin: 0; padding: 0 10px 6px; overflow-y: auto; flex: 1; }
  #notes li {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    padding: 9px 11px;
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  #notes .title { flex: 1; line-height: 1.35; }
  #notes li.editable { cursor: pointer; }
  #notes li.editable:hover { border-color: var(--accent); }
  #notes .note {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #notes .detail { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .tagstrip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  #notes li.deadline { border-left: 3px solid var(--warn); }
  #notes li.deadline .detail { color: var(--warn); }
  #notes .kill {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
  }
  #notes .kill:hover { color: var(--bad); }
  #notes .empty { background: none; border: none; color: var(--muted); padding: 4px 2px; }
  .add { display: flex; padding: 0 10px 10px; }
  .add input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font: inherit;
    outline: none;
  }
  .add input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title">Calendar</h1>
  <div class="nav">
    <button id="prev" title="previous month">‹</button>
    <button id="next" title="next month">›</button>
    <button id="today" title="back to this month" hidden>Today</button>
  </div>
  <span class="hint">pick a day, then type to add a note</span>
</header>
<main>
  <div id="month"></div>
  <section id="panel">
    <h2 id="panel-title">No day selected</h2>
    <ul id="notes"></ul>
    <div class="add">
      <input id="new-note" placeholder="Add a note…" disabled>
    </div>
  </section>
</main>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let bridge = null;
let selected = null;
let latest = null;
let offset = 0;

function dayCell(cell) {
  const box = document.createElement("div");
  if (!cell) {
    box.className = "day blank";
    return box;
  }
  box.className = "day";
  if (cell.today) box.classList.add("today");
  if (cell.date === selected) box.classList.add("selected");
  box.dataset.date = cell.date;

  const num = document.createElement("div");
  num.className = "num";
  num.textContent = cell.day;
  box.appendChild(num);

  const notes = (latest.notes[cell.date] || []);
  if (notes.length) {
    const dots = document.createElement("div");
    dots.className = "dots";
    notes.slice(0, 6).forEach((note) => {
      const dot = document.createElement("span");
      dot.className = note.kind === "deadline" ? "dot deadline" : "dot";
      dots.appendChild(dot);
    });
    box.appendChild(dots);
  }

  box.addEventListener("click", () => select(cell.date));
  return box;
}

function renderMonth() {
  const root = document.getElementById("month");
  root.textContent = "";

  const head = document.createElement("div");
  head.className = "weekdays";
  latest.weekdays.forEach((name) => {
    const span = document.createElement("span");
    span.textContent = name;
    head.appendChild(span);
  });
  root.appendChild(head);

  latest.weeks.forEach((week) => {
    const row = document.createElement("div");
    row.className = "week";
    week.forEach((cell) => row.appendChild(dayCell(cell)));
    root.appendChild(row);
  });
}

function openEditor(note) {
  avatarEditor.open({
    title: note.title,
    text: note.text,
    stamp: selected,
    tags: {selected: (note.tags || []).map((tag) => tag.name), all: latest.tags},
    fields: [
      {name: "begin", label: "From", type: "time", value: note.begin},
      {name: "end", label: "To", type: "time", value: note.end},
    ],
    onSave: (result) => bridge.edit_note(
      note.id, result.title, result.text,
      result.values.begin, result.values.end, JSON.stringify(result.tags)),
  });
}

function tagStrip(tags) {
  const strip = document.createElement("div");
  strip.className = "tagstrip";
  tags.forEach((tag) => {
    const chip = document.createElement("span");
    chip.className = "tag";
    chip.textContent = tag.name;
    if (tag.color) {
      chip.style.borderColor = tag.color;
      chip.style.color = tag.color;
    }
    strip.appendChild(chip);
  });
  return strip;
}

function renderPanel() {
  const title = document.getElementById("panel-title");
  const list = document.getElementById("notes");
  const input = document.getElementById("new-note");
  list.textContent = "";

  if (!selected) {
    title.textContent = "No day selected";
    input.disabled = true;
    return;
  }

  title.textContent = selected;
  input.disabled = false;

  const notes = latest.notes[selected] || [];
  if (!notes.length) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "Nothing on this day yet.";
    list.appendChild(empty);
    return;
  }

  notes.forEach((note) => {
    const item = document.createElement("li");
    if (note.kind === "deadline") item.className = "deadline";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = note.title;
    if (note.text) {
      const body = document.createElement("span");
      body.className = "note";
      body.textContent = note.text;
      title.appendChild(body);
    }
    if (note.tags && note.tags.length) title.appendChild(tagStrip(note.tags));
    const stamp = document.createElement("span");
    stamp.className = "detail";
    stamp.textContent = note.detail;
    title.appendChild(stamp);
    item.appendChild(title);

    if (note.kind === "note") {
      item.classList.add("editable");
      item.addEventListener("click", () => openEditor(note));

      const kill = document.createElement("button");
      kill.className = "kill";
      kill.textContent = "×";
      kill.addEventListener("click", (event) => {
        event.stopPropagation();
        bridge.delete_note(note.id);
      });
      item.appendChild(kill);
    }

    list.appendChild(item);
  });
}

function select(day) {
  selected = day;
  renderMonth();
  renderPanel();
  document.getElementById("new-note").focus();
}

function render(data) {
  const first = !latest;
  latest = data;
  document.getElementById("title").textContent = data.title;
  document.getElementById("today").hidden = offset === 0;

  if (first) selected = data.today;
  else if (selected && selected.slice(0, 7) !== data.focus.slice(0, 7)) selected = null;

  renderMonth();
  renderPanel();
}

function refresh() {
  bridge.snapshot_at(offset, (payload) => render(JSON.parse(payload)));
}

function step(by) {
  offset = by === 0 ? 0 : offset + by;
  refresh();
}

new QWebChannel(qt.webChannelTransport, (channel) => {
  bridge = channel.objects.calendar;
  bridge.changed.connect(refresh);

  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("today").addEventListener("click", () => step(0));

  const input = document.getElementById("new-note");
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && input.value.trim() && selected) {
      bridge.add_note(selected, input.value);
      input.value = "";
    }
  });

  refresh();
});
</script>
</body>
</html>
