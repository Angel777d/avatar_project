[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar.ui"
version = "0.1.0"
description = "UI API of the avatar project: HTML windows with python as the data provider"

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]

requires-python = ">=3.13"
dependencies = [
    "PySide6 >= 6.9",
]

license = "MIT"

[tool.setuptools.packages.find]
include = ["avatar_ui*"]
