[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar.ui"
version = "0.1.1"
description = "UI API of the avatar project: HTML windows with python as the data provider"

authors = [
    { name = "Angelovich", email = "angel777da@gmail.com" },
]

requires-python = ">=3.13"
dependencies = [
    "avatar.api >= 0.1.0",
    "PySide6 >= 6.9",
]

license = "MIT"

[project.entry-points.'avatar.plugins']
avatar_ui = 'avatar_ui'

[tool.setuptools.packages.find]
include = ["avatar_ui*"]

[tool.setuptools.package-data]
avatar_ui = ["assets/*"]
