name: supervisor

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: >
          dotnet publish supervisor/Supervisor.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # config.json names the wheels of the release it ships with, so the tag goes in here too
      - if: startsWith(github.ref, 'refs/tags/')
        run: python .github/stamp_version.py "${env:GITHUB_REF_NAME}"

      - run: >
          Copy-Item supervisor/samples/config.json publish/config.json;
          Copy-Item supervisor/samples/install.bat publish/install.bat

      - uses: actions/upload-artifact@v4
        with:
          name: supervisor
          path: |
            publish/supervisor.exe
            publish/config.json
            publish/install.bat

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/supervisor.exe
            publish/config.json
            publish/install.bat
