name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: avatar-api
            path: api
          - name: avatar-core
            path: core
          - name: avatar-ui
            path: ui
          - name: avatar-default
            path: plugins/avatar
          - name: avatar-kanban
            path: plugins/kanban
          - name: avatar-calendar
            path: plugins/calendar
          - name: avatar-pomodoro
            path: plugins/pomodoro
          - name: avatar-stats
            path: plugins/stats
          - name: avatar-manager
            path: plugins/manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: python -m pip install --upgrade build

      - if: startsWith(github.ref, 'refs/tags/')
        run: python .github/stamp_version.py "${GITHUB_REF_NAME}"

      - run: python -m build --wheel --outdir dist ${{ matrix.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - run: python .github/stamp_version.py "${GITHUB_REF_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            supervisor.py
            config.json
            install.bat
            avatar.ico
